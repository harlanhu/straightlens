name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libpng-dev pkg-config
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-lock.txt
      - name: Build native engine
        run: bash scripts/build_ipol.sh
      - name: Run backend tests
        run: PYTHONPATH=backend python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        run: pnpm --dir frontend install --frozen-lockfile && pnpm --dir frontend run build

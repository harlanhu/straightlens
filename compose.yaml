services:
  straightlens:
    build:
      context: .
      dockerfile: Dockerfile
    image: straightlens:local
    ports:
      - "127.0.0.1:${STRAIGHTLENS_PORT:-8765}:8765"
    environment:
      STRAIGHTLENS_DATA: /app/.runtime/jobs
    volumes:
      - straightlens-jobs:/app/.runtime/jobs
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  straightlens-jobs:

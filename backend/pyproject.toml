[project]
name = "straightlens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "Pillow>=11", "numpy>=2", "opencv-python-headless>=4.10", "scipy>=1.14"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
